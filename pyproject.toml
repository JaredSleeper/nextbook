[project]
name = "nextbook"
version = "0.1.0"
description = "Prompt-guided book recommendations from real catalog candidates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.49",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "fastembed>=0.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextbook"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "FURB", "PLW"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
